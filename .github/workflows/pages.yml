# Publishes the Factory Board static app (repo root) to GitHub Pages.
# Repo Settings → Pages → Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ['*.html', '*.js', '*.css', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # visual-check/ holds dev fixtures (PNGs, capture script) — drop them.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a . _site/ --exclude '.git' --exclude 'visual-check' \
            --exclude '_site' --exclude '.github'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
